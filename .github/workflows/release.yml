name: Release

# 打 tag（如 v1.0.0）时自动编译并发布，产物结构要匹配 install.sh 的解包约定：
#   x-ui/x-ui, x-ui/x-ui.sh, x-ui/bin/xray-linux-<arch>, x-ui/x-ui.service

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布用的 tag 名（如 v1.0.0）'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
            xray_asset: Xray-linux-64.zip
            xray_bin: xray
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            xray_asset: Xray-linux-arm64-v8a.zip
            xray_bin: xray

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-aarch64-linux-gnu

      - name: 编译面板（CGO_ENABLED=1，sqlite 需要）
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath -ldflags "-s -w" -o x-ui .

      - name: 下载 Xray-core（固定版本）
        env:
          # 【不要随意升级】固定内核版本，不跟随 latest。
          #
          # 原因：REALITY 从 Xray 26.7 起改用 X25519MLKEM768（后量子混合密钥交换），
          # 老客户端（iOS Shadowrocket、mihomo 1.19.x）不支持，表现为「能连但一个字节都传不出去」，
          # 服务端日志为：REALITY: processed invalid connection ... authentication failed
          # 参见 https://github.com/XTLS/Xray-core/issues/6477
          #
          # 实测（同一台机器、同一份配置、只换内核）：
          #   25.9.11    iOS Shadowrocket ✅
          #   26.9.9     iOS Shadowrocket ❌
          #   26.10.21   iOS Shadowrocket ❌
          #
          # 升级前必须用 iPhone + Shadowrocket 实测 Reality 节点能否出网。
          # 需要新内核的用户可在面板【设置 → Xray 版本】自行切换。
          XRAY_VERSION: v25.9.11
        run: |
          set -e
          url="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${{ matrix.xray_asset }}"
          echo "xray: $url"
          curl -fsSL -o xray.zip "$url"
          mkdir -p xraydl
          unzip -o -q xray.zip -d xraydl
          chmod +x xraydl/xray
          echo "version: $(xraydl/xray version | head -1)"

      - name: 打包
        run: |
          set -e
          mkdir -p stage/x-ui/bin
          cp x-ui stage/x-ui/x-ui
          cp x-ui.sh stage/x-ui/x-ui.sh
          cp x-ui.service stage/x-ui/x-ui.service
          # 菜单 25/27/28/29 依赖这些脚本，必须随包分发
          cp -r scripts stage/x-ui/scripts
          cp xraydl/xray "stage/x-ui/bin/xray-linux-${{ matrix.arch }}"
          # Xray 默认路由规则引用 geoip:private，缺 geoip.dat 会启动失败并无限重启
          # 官方 zip 里自带这两个文件，必须一起打包
          cp xraydl/geoip.dat stage/x-ui/bin/geoip.dat
          cp xraydl/geosite.dat stage/x-ui/bin/geosite.dat
          chmod +x stage/x-ui/x-ui stage/x-ui/x-ui.sh stage/x-ui/scripts/*.sh stage/x-ui/bin/xray-linux-${{ matrix.arch }}
          cd stage && tar -czf "../x-ui-linux-${{ matrix.arch }}.tar.gz" x-ui
          cd .. && ls -lh x-ui-linux-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: x-ui-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: cd dist && sha256sum *.tar.gz > sha256sum.txt && cat sha256sum.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/sha256sum.txt
          generate_release_notes: true
          body: |
            安装：

            ```bash
            bash <(curl -Ls https://raw.githubusercontent.com/yosituta/x-panel/main/install.sh)
            ```

            产物结构：`x-ui/{x-ui, x-ui.sh, x-ui.service, bin/xray-linux-<arch>}`
