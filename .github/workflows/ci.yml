name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Linux, CGO)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: go vet
        run: go vet ./...

      - name: go build
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags "-s -w" -o x-ui .

      - name: go test
        env:
          CGO_ENABLED: '1'
        run: go test ./...

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-amd64
          path: x-ui
          if-no-files-found: error
